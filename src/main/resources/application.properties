spring.application.name=helma-backend
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/helma?useSSL=false&serverTimezone=UTC
ai.model.base-url=http://127.0.0.1:8000
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.liquibase.enabled=false

app.jwt.secret=${JWT_SECRET:change-me-use-env-var-with-at-least-64-chars}
app.jwt.expiration-minutes=60
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}


mailjet.apiKey=${MAILJET_API_KEY:}
mailjet.secretKey=${MAILJET_SECRET_KEY:}
mailjet.fromEmail=${MAILJET_FROM_EMAIL:aziz.gharbi@esprit.tn}
mailjet.fromName=Helma

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
