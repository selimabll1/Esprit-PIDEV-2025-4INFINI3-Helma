spring.application.name=loan-service
# configuration serveurr

#config bdd
spring.datasource.url=jdbc:mysql://localhost:3307/loan_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#config jpa/hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# debug
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI JSON documentation
springdoc.api-docs.path=/api-docs

# Activer Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
server.port=8081
server.servlet.context-path=/h 
