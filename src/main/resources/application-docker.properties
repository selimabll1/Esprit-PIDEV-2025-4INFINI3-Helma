spring.application.name=helma-backend
server.port=8080

spring.datasource.url=jdbc:mysql://mysql:3306/helma?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=helma
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.liquibase.enabled=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=60

app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

ai.model.base-url=${AI_MODEL_BASE_URL:http://host.docker.internal:8000}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

mailjet.apiKey=${MAILJET_API_KEY:}
mailjet.secretKey=${MAILJET_SECRET_KEY:}
mailjet.fromEmail=${MAILJET_FROM_EMAIL:}
mailjet.fromName=${MAILJET_FROM_NAME:Helma}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.open-in-view=false