spring.application.name=helma-auth-service
server.port=8080

spring.datasource.url=jdbc:mysql://mysql:3306/helma?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=helma
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=60

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always