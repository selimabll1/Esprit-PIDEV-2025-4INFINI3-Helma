<div class="table-wrap" *ngIf="payments.length; else emptyHistory">
  <table class="table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Amount</th>
        <th>Method</th>
        <th>Reference</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let payment of payments">
        <td>{{ payment.paidAt }}</td>
        <td>{{ payment.amount }}</td>
        <td>{{ payment.paymentMethod }}</td>
        <td>{{ payment.reference }}</td>
      </tr>
    </tbody>
  </table>
</div>

<ng-template #emptyHistory>
  <p class="section-copy">No payments found.</p>
</ng-template>
